# =============================================================================
# CI PIPELINE: lint, typecheck, test, build, then deploy
# Runs on every PR and every push to main. Deploys to EC2 only on a push to main,
# and only in repos that set the DEPLOY_ENABLED variable.
# =============================================================================

name: CI

# -----------------------------------------------------------------------------
# WHEN does this workflow run?
# -----------------------------------------------------------------------------
on:
  push:
    branches: [main] # every merge/push to main
  pull_request: # every PR

# -----------------------------------------------------------------------------
# Only one run at a time. A second run waits for the first to finish.
# -----------------------------------------------------------------------------
concurrency:
  group: CI
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # JOB: CHECK
  # Any failing step stops the job and fails the run.
  # ===========================================================================
  check:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      # --- Get the code ------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7

      # --- Prepare Yarn ------------------------------------------------------
      # Provides Yarn 4 from package.json. Must run before setup-node.
      - name: Enable Corepack
        run: corepack enable

      # --- Prepare Node ------------------------------------------------------
      # Keep in sync with .nvmrc. "cache: yarn" makes installs faster.
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn

      # --- Install dependencies ---------------------------------------------
      # --immutable fails if yarn.lock is out of date.
      - name: Install dependencies
        run: yarn install --immutable

      # --- Generate the Prisma client ---------------------------------------
      # Not committed, but lint, typecheck and tests import it.
      - name: Generate Prisma client
        run: yarn prisma:generate

      # --- QUALITY GATES -----------------------------------------------------
      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: E2E tests
        run: yarn test:e2e # Prisma and Redis are faked, no database needed

      - name: Build
        run: yarn build

  # ===========================================================================
  # JOB: DEPLOY
  # SSH into EC2, pull main, rebuild and restart the containers.
  # Needs the repo variable DEPLOY_ENABLED=true and the secrets EC2_HOST,
  # EC2_USER, EC2_SSH_KEY and EC2_KNOWN_HOSTS.
  # ===========================================================================
  deploy:
    name: Deploy to EC2
    needs: check # runs only if the quality gate passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the image build on t3.micro takes 5-15 minutes

    steps:
      # --- Prepare SSH -------------------------------------------------------
      # Secrets go in through env, so their content can't change the script.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # --- Deploy ------------------------------------------------------------
      # Same commands as a manual deploy, then wait until the new app answers.
      - name: Deploy
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" '
            set -e
            cd ~/apps/nestjs-starter-pack
            git pull --ff-only
            docker compose up -d --build
            curl -fsS --retry 20 --retry-delay 5 --retry-all-errors localhost:5000/api/health
          '
